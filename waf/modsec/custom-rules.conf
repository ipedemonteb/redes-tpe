# Reglas propias del TPE (IDs 10000-19999).
# Este archivo se monta en /etc/modsecurity.d/owasp-crs/rules/ y el WAF lo
# incluye por el glob `Include .../rules/*.conf` del setup.conf de la imagen.

# --- 3.1 Paths internos solo alcanzables desde adentro del clúster ---
# /utility, /proxy, /actuator, /info y /topology exponen funciones internas
# (datos de clientes, métricas, apagar la UI). El CRS no las conoce porque son
# nuestras, así que la regla es propia.
SecRule REQUEST_FILENAME "@rx ^/(?:utility|proxy|actuator|info|topology)(?:[/;]|$)" \
    "id:10100,phase:1,deny,status:403,log,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Endpoint interno accedido desde IP no permitida',chain"
    # Usamos REMOTE_ADDR (no el header X-Real-IP directo) para evitar fail-open:
    # el paso 5 ya hace que REMOTE_ADDR tome la IP real vía realip, y siempre
    # tiene un valor con el que comparar. 10.244.0.0/16 = red de pods del clúster.
    SecRule REMOTE_ADDR "!@ipMatch 10.244.0.0/16,127.0.0.1"

# --- 3.4 Cookie SESSIONID con formato válido (UUID v4) ---
# La UI (SessionIDWebFilter.java) acepta cualquier valor de SESSIONID sin validar,
# así que un atacante puede fijar `victima-123` o probar IDs predecibles y caer en
# la sesión de otro (IDOR). El CRS no conoce esta cookie porque es nuestra; por eso
# la regla es propia. Validamos el formato UUID v4 en fase 1 (solo mira headers).
# Si la cookie NO viene (primera visita), @rx no se evalúa: la UI crea una nueva.
SecRule REQUEST_COOKIES:SESSIONID "!@rx ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" \
    "id:10300,phase:1,deny,status:403,log,\
    t:none,t:lowercase,\
    msg:'SESSIONID con formato invalido (se espera UUID v4)'"

# Más de una cookie SESSIONID = intento de confundir el parseo (HTTP parameter
# pollution). &REQUEST_COOKIES:SESSIONID cuenta cuántas vinieron; >1 → 403.
SecRule &REQUEST_COOKIES:SESSIONID "@gt 1" \
    "id:10301,phase:1,deny,status:403,log,\
    msg:'Mas de una cookie SESSIONID'"
