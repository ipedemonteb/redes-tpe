apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waf
  namespace: edge-security
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: "localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waf
                port:
                  number: 80
