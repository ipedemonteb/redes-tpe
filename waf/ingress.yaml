apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waf
  namespace: edge-security
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    # Sin "host": el ingress atiende cualquier Host (localhost, IP de LAN/VPN, etc.).
    # Filtrar por Host no es un control de seguridad (el cliente lo controla); la
    # proteccion es ModSecurity. Dejarlo abierto permite acceso remoto directo.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waf
                port:
                  number: 80
