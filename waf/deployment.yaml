apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: edge-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
        - name: waf
          image: owasp/modsecurity-crs:4.30.0-nginx-202610180210
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND
              value: "http://ui.the-store.svc.cluster.local"
            # Modo del motor. El default es On (fail-closed): cada apply deja el
            # WAF bloqueando. Para comparar "sin WAF" se usa ./scripts/waf.sh mode off.
            - name: MODSEC_RULE_ENGINE
              value: "On"
            # 3.5 Estructura del request: límite de tamaño del body (no-files).
            # 128 KB. Si se supera, ModSecurity marca REQBODY_ERROR y nuestra
            # regla 10400 responde 413. Lo fijamos explícitamente para no
            # depender del default de la imagen. El Ingress corta aparte en 1 MB.
            - name: MODSEC_REQ_BODY_NOFILES_LIMIT
              value: "131072"
            - name: MODSEC_REQ_BODY_LIMIT_ACTION
              value: "Reject"
            # Audit log
            # On = todas las transacciones (RelevantOnly sería solo las sospechosas).
            - name: MODSEC_AUDIT_ENGINE
              value: "On"
            - name: MODSEC_AUDIT_LOG_FORMAT
              value: "JSON"
            - name: MODSEC_AUDIT_LOG
              value: "/dev/stdout"
            # IP real del cliente: confiamos en X-Real-IP solo si la conexión
            # viene del rango de pods (donde vive el Ingress).
            - name: SET_REAL_IP_FROM
              value: "10.244.0.0/16"
            - name: REAL_IP_HEADER
              value: "X-Real-IP"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "8"]
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-extra
              mountPath: /etc/nginx/conf.d/realip.conf
              subPath: realip.conf
            # Reglas propias: el setup.conf de la imagen incluye
            # /etc/modsecurity.d/owasp-crs/rules/*.conf, así que dejar el
            # archivo ahí alcanza para que ModSecurity lo cargue.
            - name: modsec-rules
              mountPath: /etc/modsecurity.d/owasp-crs/rules/zzz-custom-rules.conf
              subPath: custom-rules.conf
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: nginx-extra
          configMap:
            name: waf-nginx
        - name: modsec-rules
          configMap:
            name: waf-modsec-rules
